name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

# binoc is Windows-only for now (a single net10.0 head, no macOS build), so one job does the lot: publish a
# self-contained single-file exe, pack it with Velopack, hash the artifacts, and publish the GitHub Release.
# (Perch splits Windows/macOS into gated build jobs; binoc has nothing to gate against yet.)
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Install vpk CLI
        run: dotnet tool install -g vpk

      - name: Get version from tag
        id: version
        run: echo "VERSION=$($env:GITHUB_REF_NAME -replace '^v','')" >> $env:GITHUB_OUTPUT

      # Self-contained single file so users don't need the .NET runtime; the version is stamped from the tag
      # so AppInfo.Version (and the in-app changelog diff) matches the release.
      - name: Publish
        run: |
          dotnet publish src/Binoc.App/Binoc.App.csproj -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true `
            -p:EnableCompressionInSingleFile=true `
            -p:DebugType=embedded `
            -p:Version=${{ steps.version.outputs.VERSION }} `
            -o publish/

      - name: Pack with Velopack
        run: vpk pack --packId Binoc --packTitle "binoc" --packVersion ${{ steps.version.outputs.VERSION }} --packDir publish/ --mainExe binoc.exe --outputDir releases/

      # SHA256SUMS.txt describes exactly the bytes about to be uploaded, so install.ps1 can verify the setup
      # exe against it before running. Generated outside releases/ then moved in, so the manifest never hashes
      # itself. Fails loudly if the setup exe install.ps1 depends on isn't there.
      - name: Generate SHA256SUMS.txt
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f releases/Binoc-win-Setup.exe ]; then
            echo "::error::Binoc-win-Setup.exe is missing - install.ps1 depends on it."
            exit 1
          fi
          ( cd releases && LC_ALL=C sha256sum -- * > ../SHA256SUMS.txt )
          mv SHA256SUMS.txt releases/SHA256SUMS.txt
          echo '### Published assets' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat releases/SHA256SUMS.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: releases/*
          generate_release_notes: true
